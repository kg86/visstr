name: Build
on:
  push:
    branches:
      - '**'
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v1

    - name: npm install, lint, format check, build, and test
      run: |
        npm install
        npm run lint
        npm run format:check
        npm run build --if-present
        npm run test
        npx typedoc src/*.ts

