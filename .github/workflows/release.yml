name: Release
on:
  push:
    tags:
      - 'v*'
  # tag-release.yml pushes the tag using the default GITHUB_TOKEN, and pushes
  # made with that token don't trigger other workflows' `push` events (this
  # restriction doesn't apply to workflow_dispatch), so it explicitly
  # dispatches this workflow against the new tag instead of relying on the
  # `push` trigger above.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v4

    - uses: actions/setup-node@v5
      with:
        node-version: 22

    - name: npm install, build, and test
      run: |
        npm install -g npm@latest
        npm --version
        npm install
        npm run build --if-present
        npm run test

    - name: Stage npm publish
      run: |
        npm --version
        npm stage publish

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "${{ github.ref_name }}" --generate-notes
