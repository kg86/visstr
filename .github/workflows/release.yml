name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v4

    - uses: actions/setup-node@v5
      with:
        node-version: 22

    - name: npm install, build, and test
      run: |
        npm install -g npm@latest
        npm install
        npm run build --if-present
        npm run test

    - name: Publish to npm
      run: npm publish
